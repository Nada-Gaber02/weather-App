<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body data-bs-spy="scroll" data-bs-target="#navbar-scroll">
<div class="container-fluid weatherPage">
    <div class="container">
        <nav class="navbar navbar-expand-lg" id="navbar-scroll">
            <div class="nav-logo d-flex gap-2">
                <img src="images/logo@2x.png" class="w-25" alt="cloud">
                <div class="nav-brand d-flex flex-column">
                    <a class="brand-name1" href="#">Weather</a>
                    <a class="brand-name2" href="#">tagline goes here</a>
                </div>
            </div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto m-5 gap-2">
                <li class="nav-item">
                    <a class="nav-link active home" aria-current="page" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">News</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Live Cameras</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Photos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link contact" href="./contact.html">Contact</a>
                </li>
                </ul>
            </div>
        </nav>
    </div>
    <div class="back-img ">
        <div class="container overflow-auto">
            <div class="input-group mb-3 mt-5">
                <input type="text" id="search" class="form-control" placeholder="Find your location..." aria-describedby="button-addon2">
                <div class="buttonn">
                    <button class="btn" type="button" id="button-addon2">Find</button>
                </div>
            </div>
            <div class="row weatherCard d-flex p-5 ">
                <div class="col-xl-4 card-header">
                    <div class=" d-flex justify-content-between align-items-center p-2">
                        <span id="date1">Monday</span>
                        <div class="d-flex">
                            <p class="m-0" id="date2">28</p><span id="monthDate">April</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <p class="p1">Cairo</p>
                        <p class="p2">26.4<sup>o</sup>C</p>
                        <img id="weatherImg" src="images/113 (1).png" class="w-25" alt="sun">
                        <p class="p3">Sunny</p>
                        <div class="footer d-flex gap-3">
                            <img src="images/icon-umberella@2x.png"  alt="umbrella"><p>20%</p>
                            <img src="images/icon-wind@2x.png"  alt="wind"><p>18km/h</p>
                            <img src="images/icon-compass@2x.png"  alt="compass"><p>East</p>
                        </div>
                    </div>
                </div>
                <div class="col-xl-4 card-header2">
                    <div class="content text-center p-2">
                        <span>Wednesday</span>
                    </div>
                    <div class="card-body2 d-flex flex-column justify-content-center align-items-center m-lg-5">
                        <img src="images/113 (1).png" id="weatherImg2" class="w-25" alt="sun">
                        <p class="p4">34.4<sup>o</sup>C</p>
                        <span>18.7<sup>o</sup></span>
                        <p class="p5">sunny</p>
                    </div>
                </div>
                <div class="col-xl-4 card-header3">
                    <div class="content p-2 text-center">
                        <span>Thursday</span>
                    </div>
                    <div class="card-body3 d-flex flex-column justify-content-center align-items-center m-lg-5">
                        <img src="images/113 (1).png" id="weatherImg3" class="w-25" alt="sun">
                        <p class="p4">34.4<sup>o</sup>C</p>
                        <span>18.7<sup>o</sup></span>
                        <p class="p5">sunny</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <div class="container overflow-auto">
            <div class="row">
                <div class="col-md-8">
                    <div class="input-group mb-3 mt-5">
                        <input type="text" class="form-control" placeholder="Enter Your Email to subscribe..." aria-describedby="button-addon2">
                        <div class="buttonn">
                            <button class="btn2" type="button" id="button-addon2">Subscribe</button>
                        </div>
                    </div>
                    <div class="footer-text mb-5 pb-5 mt-4">
                        <p>Copyright 2014 Company name. Designed by Themezy. All rights reserved</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="links mb-3 mt-5 d-flex justify-content-center align-items-center gap-2">
                        <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                        <a href="#"><i class="fa-brands fa-twitter"></i></a>
                        <a href="#"><i class="fa-brands fa-google-plus-g"></i></a>
                        <a href="#"><i class="fa-brands fa-pinterest"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </footer>
</div>


<script src="JS/bootstrap.bundle.min.js"></script>
<script src="JS/weather.js"></script>
</body>
</html>
